<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<body>
<header class="site-header" th:fragment="siteHeader(activePage)">
    <div class="header-inner shell">
        <a class="brand" th:href="@{/}" aria-label="CineCookie — página inicial">
            <span class="brand-mark" aria-hidden="true">
                <img th:src="@{/images/logo.png}" alt="">
            </span>
            <span class="brand-copy">
                <span class="brand-name">CineCookie</span>
            </span>
        </a>

        <button class="menu-toggle" type="button" aria-label="Abrir menu" aria-expanded="false"
                aria-controls="main-navigation">
            <span></span><span></span><span></span>
        </button>

        <nav class="main-nav" id="main-navigation" aria-label="Navegação principal">
            <div class="nav-links">
                <a th:href="@{/}" th:classappend="${activePage == 'home'} ? ' is-active'">Início</a>
                <a th:href="@{/filmes}">Filmes</a>
                <a th:href="@{/#atividade}">Comunidade</a>
            </div>
            <div class="nav-actions" th:if="${currentUser == null}">
                <a class="button button-ghost" th:href="@{/login}">Entrar</a>
                <a class="button button-primary button-small" th:href="@{/cadastro}">Criar conta</a>
            </div>
            <div class="nav-actions account-actions" th:if="${currentUser != null}">
                <div class="account-identity">
                    <img class="account-avatar" th:src="@{/images/avatar-default.svg}" alt="Avatar padrão do usuário" width="40" height="40">
                    <span class="account-copy">
                        <strong th:text="${currentUser.name}">Nome do usuário</strong>
                        <small th:text="|@${currentUser.username}|">@usuario</small>
                    </span>
                </div>
                <form class="logout-form" th:action="@{/logout}" method="post">
                    <button class="button button-ghost logout-button" type="submit" aria-label="Sair da sua conta">
                        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5H5v14h4M14 8l4 4-4 4M9 12h12"/></svg>
                        Sair
                    </button>
                </form>
            </div>
        </nav>
    </div>
</header>
</body>
</html>

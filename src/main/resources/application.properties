spring.application.name=CineCookie
spring.thymeleaf.cache=false
server.error.whitelabel.enabled=false
server.max-http-request-header-size=32KB

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/cinecookie}
spring.datasource.username=${DB_USERNAME:cinecookie}
spring.datasource.password=${DB_PASSWORD:cinecookie}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

spring.application.name=CineCookie

# Porta: a plataforma (Render) fornece PORT; localmente usa 8080.
server.port=${PORT:8080}
# O Render termina o HTTPS no proxy; isso mantém redirects e URLs corretos.
server.forward-headers-strategy=framework
server.max-http-request-header-size=32KB

# Erros em produção não expõem stack trace, SQL, caminhos ou configurações.
server.error.whitelabel.enabled=false
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=false
server.error.include-binding-errors=never

spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/css/**

# Banco (Neon): valores vêm do ambiente. Sem fallback, para não versionar segredos.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# Health check: apenas /actuator/health, sem detalhes internos.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

logging.level.root=INFO

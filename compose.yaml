services:
  app:
    build: .
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      DB_URL: ${DB_URL:?defina DB_URL no arquivo .env.dev}
      DB_USER: ${DB_USER:?defina DB_USER no arquivo .env.dev}
      DB_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no arquivo .env.dev}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

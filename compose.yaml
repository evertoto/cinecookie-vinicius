services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: cinecookie
      POSTGRES_USER: cinecookie
      POSTGRES_PASSWORD: cinecookie
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cinecookie -d cinecookie"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - cinecookie_postgres_data:/var/lib/postgresql/data

volumes:
  cinecookie_postgres_data:

# OPCIONAL: PostgreSQL local em container, para desenvolver sem usar o Neon.
# Uso: docker compose -f compose.yaml -f compose.local-db.yaml --env-file .env.dev up --build
# No .env.dev: DB_URL=jdbc:postgresql://database:5432/cinecookie, DB_USER=cinecookie, DB_PASSWORD=cinecookie
services:
  app:
    depends_on:
      database:
        condition: service_healthy
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: cinecookie
      POSTGRES_USER: ${DB_USER:-cinecookie}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-cinecookie}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d cinecookie"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - cinecookie_postgres_data:/var/lib/postgresql/data

volumes:
  cinecookie_postgres_data:

# CI simples: a cada push/PR, compila e roda os testes (H2, sem acessar o Neon).
# O CD fica por conta do auto-deploy do Render ao detectar push na main.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Build e testes
        run: mvn --batch-mode --no-transfer-progress verify
